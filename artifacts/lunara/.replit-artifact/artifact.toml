kind = "mobile"
previewPath = "/"
title = "Lunara"
description = "Lunara is a private daily ritual app for couples (ages 16–28). Every night, each partner privately answers three short prompts — Grateful, Cute, Grow — then both answers are revealed together in a soft, beautiful animation. The app features a deep-indigo cosmic design system with frosted glass cards, streak tracking with moon-phase visuals, couple pairing via invite code, and a full onboarding flow with psychological benefits and subscription info."
version = "1.0.0"
id = "artifacts/lunara"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18961

[services.development]
run = "pnpm --filter @workspace/lunara run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lunara", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lunara", "run", "serve" ]

[services.env]
PORT = "18961"
BASE_PATH = "/"
